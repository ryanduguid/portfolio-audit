[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
# scripts/ is not a package, so name it from the repository root. Without this
# mypy sees scripts/portfolio_audit.py as both portfolio_audit and
# scripts.portfolio_audit and stops before checking anything.
mypy_path = "."
explicit_package_bases = true
# PyYAML ships no stubs in this environment, and the tests only use safe_load,
# dump and BaseLoader.
ignore_missing_imports = true

name: Portfolio audit

on:
  schedule:
    - cron: '0 22 * * 0'
  workflow_dispatch:
    inputs:
      send_email:
        description: Send the generated public-only report by email
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: portfolio-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  invocation_guard:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require the default branch
        env:
          AUDIT_REF: ${{ github.ref }}
        run: |
          if [ "$AUDIT_REF" != "refs/heads/main" ]; then
            echo "Credentialled portfolio audits may run only from main." >&2
            exit 1
          fi

  collect:
    needs: invocation_guard
    environment: portfolio-audit-collect
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      report-status: ${{ steps.report.outputs.status }}
      report-reason: ${{ steps.report.outputs.reason }}
    steps:
      - name: Check out control repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Prepare audit output
        run: mkdir -p audit-output
      # No continue-on-error. A credential that cannot be minted is a
      # configuration failure, not a collection outcome: it must present as a
      # failed step naming the missing input, not as a successful step that
      # hands the collector an empty token and yields INCOMPLETE. INCOMPLETE
      # stays reserved for collection that ran and could not finish, and
      # enforce still reports a collect job that did not succeed.
      - name: Mint read-only GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PORTFOLIO_AUDIT_APP_CLIENT_ID }}
          private-key: ${{ secrets.PORTFOLIO_AUDIT_APP_PRIVATE_KEY }}
          owner: ryanduguid
          permission-actions: read
          permission-contents: read
          permission-pull-requests: read
      - name: Collect public portfolio evidence
        env:
          PORTFOLIO_AUDIT_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: python
        run: |
          import runpy
          import sys

          sys.argv = [
              "scripts/portfolio_audit.py",
              "--policy", "portfolio-audit-policy.json",
              "--json-output", "audit-output/audit.json",
              "--text-output", "audit-output/audit.txt",
          ]
          runpy.run_path("scripts/portfolio_audit.py", run_name="__main__")
      - name: Record report status and summary
        id: report
        env:
          REPORT_JSON: audit-output/audit.json
          REPORT_TEXT: audit-output/audit.txt
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          report = json.loads(Path(os.environ["REPORT_JSON"]).read_text(encoding="utf-8"))
          status = report.get("status")
          if status not in {"ALL_CLEAR", "ACTION_REQUIRED", "INCOMPLETE"}:
              raise SystemExit("invalid report status")
          # A collection error is the only thing that explains an INCOMPLETE run,
          # and the enforce job reads neither the artefact nor the step summary.
          # Carry the codes across as a job output so the failure names itself.
          codes = set()
          for problem in report.get("collection_errors") or []:
              if not isinstance(problem, dict):
                  continue
              code = problem.get("code")
              # This value reaches GITHUB_OUTPUT, where a newline would append a
              # second output line. Drop anything off-shape rather than escape it.
              if isinstance(code, str) and re.fullmatch(r"[A-Z0-9_]{1,64}", code):
                  codes.add(code)
          # ponytail: codes only. Each problem's summary and repository stay in the
          # artefact and the step summary, which already carry the whole report.
          reason = ",".join(sorted(codes))
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"status={status}\n")
              output.write(f"reason={reason}\n")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write("## Portfolio audit\n\n")
              for line in Path(os.environ["REPORT_TEXT"]).read_text(encoding="utf-8").splitlines():
                  summary.write(f"    {line}\n")
          PY
      - name: Upload delivery artefact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portfolio-audit-report-${{ github.run_id }}
          path: |
            audit-output/audit.json
            audit-output/audit.txt
          if-no-files-found: error
          retention-days: 7

  deliver:
    needs: collect
    environment: portfolio-audit-deliver
    if: >-
      needs.collect.result == 'success' &&
      ((github.event_name == 'schedule' && vars.PORTFOLIO_AUDIT_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.send_email))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out immutable delivery code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Download delivery artefact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: portfolio-audit-report-${{ github.run_id }}
          path: audit-output
      - name: Send public-only digest
        env:
          PORTFOLIO_AUDIT_EMAIL: ${{ secrets.PORTFOLIO_AUDIT_EMAIL }}
          PROTON_SMTP_TOKEN: ${{ secrets.PROTON_SMTP_TOKEN }}
        run: >-
          python scripts/send_portfolio_audit.py
          --json-report audit-output/audit.json
          --text-report audit-output/audit.txt

  enforce:
    needs:
      - collect
      - deliver
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Enforce report and requested delivery
        env:
          COLLECT_RESULT: ${{ needs.collect.result }}
          REPORT_STATUS: ${{ needs.collect.outputs.report-status }}
          REPORT_REASON: ${{ needs.collect.outputs.report-reason }}
          DELIVERY_RESULT: ${{ needs.deliver.result }}
          DELIVERY_REQUESTED: ${{ (github.event_name == 'schedule' && vars.PORTFOLIO_AUDIT_ENABLED == 'true') || (github.event_name == 'workflow_dispatch' && inputs.send_email) }}
        run: |
          if [ "$COLLECT_RESULT" != "success" ]; then
            echo "Portfolio audit collection did not complete." >&2
            exit 1
          fi
          if [ "$REPORT_STATUS" != "ALL_CLEAR" ]; then
            if [ -n "$REPORT_REASON" ]; then
              echo "Portfolio audit status: $REPORT_STATUS ($REPORT_REASON)" >&2
            else
              echo "Portfolio audit status: $REPORT_STATUS" >&2
            fi
            exit 1
          fi
          if [ "$DELIVERY_REQUESTED" = "true" ] && [ "$DELIVERY_RESULT" != "success" ]; then
            echo "Requested portfolio audit delivery did not complete." >&2
            exit 1
          fi
